# Unified UI tests (ADR-0027, proposed). The Testing Tool is chosen per run:
#   ./mvnw test                                    -> browserless (default)
#   ./mvnw test -Dvaadin.testing.tool=playwright   -> real Chromium
#   ./mvnw test -Dvaadin.testing.tool=selenium     -> Chrome via TestBench; local only,
#     needs a Vaadin license (pom.xml profile "selenium"); headed with
#     -Dvaadin.testing.selenium.headless=false
# Browserless only discovers routes in these packages; the default is the test
# class's own package, which misses every view outside it (e.g. DashboardView).
vaadin.testing.browserless.view-packages=com.vaadin.expensemanager
